name: Testes de Matematica Computacional
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar codigo sem abrir janela
        run: python -m compileall -q jogo.py src tests
      - name: Executar suite logica independente do Pygame
        run: python -m unittest discover -s tests -v